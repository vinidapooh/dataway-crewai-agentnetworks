[project]
name = "youtube_architect"
version = "0.1.0"
description = "youtube_architect using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.14.3",
    "crewai[tools]==1.14.3",
    "duckduckgo-search>=8.1.1",
    "langchain-openai>=1.2.1",
]

[project.scripts]
youtube_architect = "youtube_architect.main:run"
run_crew = "youtube_architect.main:run"
train = "youtube_architect.main:train"
replay = "youtube_architect.main:replay"
test = "youtube_architect.main:test"
run_with_trigger = "youtube_architect.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
